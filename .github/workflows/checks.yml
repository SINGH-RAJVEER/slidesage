name: Pull request checks

on:
  pull_request:
    branches: [main, dev]
  push:
    branches: [dev]
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.workflow == 'Pull request checks' }}

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    env:
      CGO_ENABLED: "0"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: ${{ github.event_name == 'push' && 50 || 1 }}

      - name: Resolve the comparison base for a push
        if: github.event_name == 'push'
        id: base
        shell: bash
        run: |
          set -euo pipefail
          before='${{ github.event.before }}'
          if [ -n "$before" ] \
            && [ "$before" != "0000000000000000000000000000000000000000" ] \
            && git cat-file -e "$before^{commit}" 2>/dev/null; then
            echo "ref=$before" >> "$GITHUB_OUTPUT"
          fi

      - id: changes
        if: github.event_name == 'pull_request' || steps.base.outputs.ref != ''
        continue-on-error: true
        uses: dorny/paths-filter@v4
        with:
          base: ${{ steps.base.outputs.ref }}
          filters: |
            api:
              - 'apps/api/**'
              - 'libs/types/**'
              - '.github/workflows/checks.yml'
              - '.github/workflows/deploy.yml'
              - 'docker-bake.hcl'
            web:
              - 'apps/web/**'
              - 'libs/**'
              - 'package.json'
              - 'bun.lock'
              - 'tsconfig.json'
              - 'biome.json'
              - '.github/workflows/checks.yml'
              - '.github/workflows/deploy.yml'
              - 'docker-bake.hcl'

      - id: scope
        shell: bash
        run: |
          set -euo pipefail
          if [ '${{ steps.changes.outcome }}' = 'success' ]; then
            echo 'api=${{ steps.changes.outputs.api }}' >> "$GITHUB_OUTPUT"
            echo 'web=${{ steps.changes.outputs.web }}' >> "$GITHUB_OUTPUT"
          else
            echo 'api=true' >> "$GITHUB_OUTPUT"
            echo 'web=true' >> "$GITHUB_OUTPUT"
          fi

      - if: steps.scope.outputs.api == 'true'
        uses: actions/setup-go@v5
        with:
          go-version-file: apps/api/go.mod
          cache: false

      - name: Stamp the Go cache key
        if: steps.scope.outputs.api == 'true'
        run: echo "GO_CACHE_DATE=$(date -u +%Y-%m-%d)" >> "$GITHUB_ENV"

      - name: Restore the Go module and build caches
        if: steps.scope.outputs.api == 'true'
        id: go-cache
        uses: actions/cache/restore@v4
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: ${{ runner.os }}-go-${{ hashFiles('apps/api/go.sum') }}-${{ env.GO_CACHE_DATE }}
          restore-keys: |
            ${{ runner.os }}-go-${{ hashFiles('apps/api/go.sum') }}-
            ${{ runner.os }}-go-

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.13

      - run: bun install --frozen-lockfile

      - if: steps.scope.outputs.web == 'true'
        run: bun run type-check

      - if: steps.scope.outputs.web == 'true'
        run: bun test
        working-directory: libs/types

      - if: steps.scope.outputs.web == 'true'
        run: bun run test:ui

      - if: steps.scope.outputs.web == 'true'
        run: bun run test:web

      - if: steps.scope.outputs.api == 'true'
        run: go test ./...
        working-directory: apps/api

      - if: steps.scope.outputs.api == 'true'
        run: go vet ./...
        working-directory: apps/api

      - if: steps.scope.outputs.web == 'true'
        run: bun run build

      - if: steps.scope.outputs.api == 'true'
        run: bun run build:api

      - name: Save the Go module and build caches
        if: >-
          github.event_name != 'pull_request'
          && steps.scope.outputs.api == 'true'
          && steps.go-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: ${{ runner.os }}-go-${{ hashFiles('apps/api/go.sum') }}-${{ env.GO_CACHE_DATE }}

  terraform:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.16.0
          terraform_wrapper: false

      - name: Check Terraform formatting
        working-directory: infra/prod
        run: terraform fmt -check -recursive

      - name: Validate Terraform configuration
        working-directory: infra/prod
        run: |
          terraform init -backend=false -input=false -lockfile=readonly
          terraform validate -no-color
