{
	"name": "Pull request checks",
	"on": {
		"pull_request": {
			"branches": [
				"main",
				"dev"
			]
		},
		"push": {
			"branches": [
				"dev"
			]
		},
		"workflow_dispatch": null
	},
	"permissions": {
		"contents": "read",
		"pull-requests": "read"
	},
	"concurrency": {
		"group": "checks-${{ github.workflow }}-${{ github.ref }}",
		"cancel-in-progress": "${{ github.workflow == 'Pull request checks' }}"
	},
	"jobs": {
		"test-and-build": {
			"runs-on": "ubuntu-latest",
			"env": {
				"CGO_ENABLED": "0"
			},
			"steps": [
				{
					"uses": "actions/checkout@v4",
					"with": {
						"fetch-depth": "${{ github.event_name == 'push' && 50 || 1 }}"
					}
				},
				{
					"name": "Resolve the comparison base for a push",
					"if": "github.event_name == 'push'",
					"id": "base",
					"shell": "bash",
					"run": "set -euo pipefail\nbefore='${{ github.event.before }}'\nif [ -n \"$before\" ] \\\n\t&& [ \"$before\" != \"0000000000000000000000000000000000000000\" ] \\\n\t&& git cat-file -e \"$before^{commit}\" 2>/dev/null; then\n\techo \"ref=$before\" >> \"$GITHUB_OUTPUT\"\nfi\n"
				},
				{
					"id": "changes",
					"if": "github.event_name == 'push' && steps.base.outputs.ref != ''",
					"continue-on-error": true,
					"uses": "dorny/paths-filter@v4",
					"with": {
						"base": "${{ steps.base.outputs.ref }}",
						"filters": "api:\n  - 'apps/api/**'\n  - 'libs/cards/**'\n  - 'libs/types/**'\n  - '.github/workflows/checks.yml'\n  - '.github/workflows/deploy.yml'\n  - 'apps/edge/**'\nweb:\n  - 'apps/web/**'\n  - 'libs/**'\n  - 'package.json'\n  - 'bun.lock'\n  - 'tsconfig.json'\n  - 'biome.json'\n  - '.github/workflows/checks.yml'\n  - '.github/workflows/deploy.yml'\n  - 'apps/edge/**'\n"
					}
				},
				{
					"id": "scope",
					"shell": "bash",
					"run": "set -euo pipefail\nif [ '${{ steps.changes.outcome }}' = 'success' ]; then\n\techo 'api=${{ steps.changes.outputs.api }}' >> \"$GITHUB_OUTPUT\"\n\techo 'web=${{ steps.changes.outputs.web }}' >> \"$GITHUB_OUTPUT\"\nelse\n\techo 'api=true' >> \"$GITHUB_OUTPUT\"\n\techo 'web=true' >> \"$GITHUB_OUTPUT\"\nfi\n"
				},
				{
					"if": "steps.scope.outputs.api == 'true'",
					"uses": "actions/setup-go@v5",
					"with": {
						"go-version-file": "apps/api/go.mod",
						"cache": "false"
					}
				},
				{
					"name": "Stamp the Go cache key",
					"if": "steps.scope.outputs.api == 'true'",
					"run": "echo \"GO_CACHE_DATE=$(date -u +%Y-%m-%d)\" >> \"$GITHUB_ENV\"\n"
				},
				{
					"name": "Restore the Go module and build caches",
					"if": "steps.scope.outputs.api == 'true'",
					"id": "go-cache",
					"uses": "actions/cache/restore@v4",
					"with": {
						"path": "~/.cache/go-build\n~/go/pkg/mod\n",
						"key": "${{ runner.os }}-go-${{ hashFiles('apps/api/go.sum') }}-${{ env.GO_CACHE_DATE }}",
						"restore-keys": "${{ runner.os }}-go-${{ hashFiles('apps/api/go.sum') }}-\n${{ runner.os }}-go-\n"
					}
				},
				{
					"uses": "oven-sh/setup-bun@v2",
					"with": {
						"bun-version": "1.3.13"
					}
				},
				{
					"run": "bun install --frozen-lockfile\n"
				},
				{
					"if": "steps.scope.outputs.web == 'true'",
					"run": "bun run type-check\n"
				},
				{
					"if": "steps.scope.outputs.web == 'true'",
					"run": "bun run test:cards\n"
				},
				{
					"if": "steps.scope.outputs.web == 'true'",
					"run": "bun run test:ui\n"
				},
				{
					"if": "steps.scope.outputs.web == 'true'",
					"run": "bun run test:web\n"
				},
				{
					"name": "Test the edge controller and object gateway",
					"run": "bun run --cwd apps/edge test"
				},
				{
					"name": "Start API integration dependencies",
					"if": "steps.scope.outputs.api == 'true'",
					"shell": "bash",
					"run": "set -euo pipefail\ndocker run -d --name slidesage-test-postgres \\\n\t-e POSTGRES_USER=slidesage -e POSTGRES_PASSWORD=slidesage -e POSTGRES_DB=slidesage \\\n\t-p 127.0.0.1:55439:5432 docker.io/pgvector/pgvector:pg17\ndocker run -d --name slidesage-test-valkey \\\n\t-p 127.0.0.1:56389:6379 docker.io/valkey/valkey:9.0-alpine \\\n\tvalkey-server --save '' --appendonly no\nready=false\nfor _ in {1..30}; do\n\tif docker exec slidesage-test-postgres pg_isready -h 127.0.0.1 -U slidesage -d slidesage \\\n\t\t&& docker exec slidesage-test-valkey valkey-cli ping; then\n\t\tready=true\n\t\tbreak\n\tfi\n\tsleep 1\ndone\ntest \"$ready\" = true\n"
				},
				{
					"name": "Migrate the disposable integration database",
					"if": "steps.scope.outputs.api == 'true'",
					"env": {
						"DATABASE_URL": "postgresql://slidesage:slidesage@127.0.0.1:55439/slidesage"
					},
					"run": "go run ./cmd/migrate\n",
					"working-directory": "apps/api"
				},
				{
					"if": "steps.scope.outputs.api == 'true'",
					"env": {
						"DATABASE_URL": "postgresql://slidesage:slidesage@127.0.0.1:55439/slidesage",
						"TEST_VALKEY_ADDR": "127.0.0.1:56389"
					},
					"run": "go test -p 1 ./...\n",
					"working-directory": "apps/api"
				},
				{
					"if": "steps.scope.outputs.api == 'true'",
					"run": "go vet ./...\n",
					"working-directory": "apps/api"
				},
				{
					"if": "steps.scope.outputs.web == 'true'",
					"run": "bun run build\n"
				},
				{
					"if": "steps.scope.outputs.api == 'true'",
					"run": "bun run build:api\n"
				},
				{
					"name": "Save the Go module and build caches",
					"if": "github.event_name != 'pull_request' && steps.scope.outputs.api == 'true' && steps.go-cache.outputs.cache-hit != 'true'",
					"uses": "actions/cache/save@v4",
					"with": {
						"path": "~/.cache/go-build\n~/go/pkg/mod\n",
						"key": "${{ runner.os }}-go-${{ hashFiles('apps/api/go.sum') }}-${{ env.GO_CACHE_DATE }}"
					}
				}
			],
			"timeout-minutes": 30
		},
		"infrastructure": {
			"runs-on": "ubuntu-latest",
			"timeout-minutes": 10,
			"steps": [
				{
					"uses": "actions/checkout@v4"
				},
				{
					"uses": "actions/setup-go@v5",
					"with": {
						"go-version-file": "apps/api/go.mod",
						"cache": false
					}
				},
				{
					"uses": "actions/setup-node@v4",
					"with": {
						"node-version": "24"
					}
				},
				{
					"uses": "oven-sh/setup-bun@v2",
					"with": {
						"bun-version": "1.3.13"
					}
				},
				{
					"uses": "docker/setup-buildx-action@v3"
				},
				{
					"name": "Validate Actions workflows",
					"run": "go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.12 -color .github/workflows/*.yml\n"
				},
				{
					"name": "Validate database Compose and shell scripts",
					"run": "./infra/check.sh\n"
				},
				{
					"name": "Compile and validate the Cloudflare Container images",
					"env": {
						"CGO_ENABLED": "0",
						"GOOS": "linux",
						"GOARCH": "amd64"
					},
					"run": "set -euo pipefail\nbun install --frozen-lockfile\nmkdir -p dist\nfor component in api worker converter container; do\n\tgo -C apps/api build -mod=readonly -trimpath -buildvcs=false -o \"$GITHUB_WORKSPACE/dist/$component\" \"./cmd/$component\"\ndone\nbun run --cwd apps/edge check\n"
				}
			]
		}
	}
}
