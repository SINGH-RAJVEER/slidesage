name: Pull request checks

on:
  pull_request:
    branches: [main, dev]
  push:
    branches: [dev]
  workflow_dispatch:
  # Called by deploy.yml so a push to main cannot reach Cloud Run without
  # these checks passing first.
  workflow_call:

permissions:
  contents: read
  # Required by dorny/paths-filter to list a pull request's changed files.
  pull-requests: read

concurrency:
  # In a called run github.workflow is the caller's name, so gating runs get
  # their own group and never cancel the standalone PR checks.
  group: checks-${{ github.workflow }}-${{ github.ref }}
  # A superseded PR push is worth cancelling; a deploy waiting on its gate is
  # not, because cancelling it fails the deploy rather than replacing it.
  cancel-in-progress: ${{ github.workflow == 'Pull request checks' }}

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    env:
      CGO_ENABLED: "0"
    steps:
      - uses: actions/checkout@v4

      # A web-only change has no reason to compile and test the Go module, and
      # the reverse holds too. This stays inside the one job rather than
      # splitting into two, so the check name branch protection requires is
      # always reported. Only pull requests are filtered: on a release gate the
      # comparison base is less certain, and there everything runs.
      - id: changes
        if: github.event_name == 'pull_request'
        uses: dorny/paths-filter@v4
        with:
          filters: |
            api:
              - 'apps/api/**'
              - 'libs/types/**'
              - '.github/workflows/checks.yml'
            web:
              - 'apps/web/**'
              - 'libs/**'
              - 'package.json'
              - 'bun.lock'
              - 'tsconfig.json'
              - 'biome.json'
              - '.github/workflows/checks.yml'

      - id: go
        if: github.event_name != 'pull_request' || steps.changes.outputs.api == 'true'
        uses: actions/setup-go@v5
        with:
          go-version-file: apps/api/go.mod
          # setup-go keys its cache on go.sum, so the build cache is never
          # refreshed while only our own source changes and each run recompiles
          # more of the module from scratch. The cache below is keyed to write
          # a fresh entry every run instead.
          cache: false

      - name: Restore the Go module and build caches
        if: github.event_name != 'pull_request' || steps.changes.outputs.api == 'true'
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          # The sha suffix means the key never hits exactly, so every run saves
          # a new entry and the restore keys fall back to the most recent one.
          key: ${{ runner.os }}-go-${{ hashFiles('apps/api/go.sum') }}-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-go-${{ hashFiles('apps/api/go.sum') }}-
            ${{ runner.os }}-go-

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.13

      - run: bun install --frozen-lockfile

      - if: github.event_name != 'pull_request' || steps.changes.outputs.web == 'true'
        run: bun run type-check

      - if: github.event_name != 'pull_request' || steps.changes.outputs.web == 'true'
        run: bun test
        working-directory: libs/types

      - if: github.event_name != 'pull_request' || steps.changes.outputs.web == 'true'
        run: bun run test:ui

      - if: github.event_name != 'pull_request' || steps.changes.outputs.web == 'true'
        run: bun run test:web

      - if: github.event_name != 'pull_request' || steps.changes.outputs.api == 'true'
        run: go test ./...
        working-directory: apps/api

      - if: github.event_name != 'pull_request' || steps.changes.outputs.api == 'true'
        run: go vet ./...
        working-directory: apps/api

      - if: github.event_name != 'pull_request' || steps.changes.outputs.web == 'true'
        run: bun run build

      - if: github.event_name != 'pull_request' || steps.changes.outputs.api == 'true'
        run: bun run build:api

  terraform:
    runs-on: ubuntu-latest
    env:
      TF_PLUGIN_CACHE_DIR: ${{ github.workspace }}/.terraform-plugin-cache
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.16.0
          terraform_wrapper: false

      # The google and cloudflare providers are large and otherwise downloaded
      # from the registry on every init, in this workflow and two others.
      - name: Restore the Terraform provider cache
        uses: actions/cache@v4
        with:
          path: ${{ env.TF_PLUGIN_CACHE_DIR }}
          key: ${{ runner.os }}-terraform-${{ hashFiles('infra/prod/.terraform.lock.hcl') }}
          restore-keys: ${{ runner.os }}-terraform-

      - name: Create the provider cache directory
        run: mkdir -p "$TF_PLUGIN_CACHE_DIR"

      - name: Check Terraform formatting
        working-directory: infra/prod
        run: terraform fmt -check -recursive

      - name: Validate Terraform configuration
        working-directory: infra/prod
        run: |
          terraform init -backend=false -input=false -lockfile=readonly
          terraform validate -no-color
