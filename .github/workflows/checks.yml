name: Pull request checks

on:
  pull_request:
    branches: [main, dev]
  push:
    branches: [dev]
  workflow_dispatch:
  # Called by deploy.yml so a push to main cannot reach Cloud Run without
  # these checks passing first.
  workflow_call:

permissions:
  contents: read
  # Required by dorny/paths-filter to list a pull request's changed files.
  pull-requests: read

concurrency:
  # In a called run github.workflow is the caller's name, so gating runs get
  # their own group and never cancel the standalone PR checks.
  group: checks-${{ github.workflow }}-${{ github.ref }}
  # A superseded PR push is worth cancelling; a deploy waiting on its gate is
  # not, because cancelling it fails the deploy rather than replacing it.
  cancel-in-progress: ${{ github.workflow == 'Pull request checks' }}

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    env:
      CGO_ENABLED: "0"
    steps:
      - uses: actions/checkout@v4
        with:
          # A push is compared against its previous head, which has to be in
          # the checkout. Fifty commits covers any realistic push range; beyond
          # that the filter below falls open and the whole suite runs.
          fetch-depth: ${{ github.event_name == 'push' && 50 || 1 }}

      # A pull request is diffed through the API against its base. A push has
      # no base to infer, so use the commit the branch moved from, and only
      # when it is a real commit that is actually present.
      - name: Resolve the comparison base for a push
        if: github.event_name == 'push'
        id: base
        shell: bash
        run: |
          set -euo pipefail
          before='${{ github.event.before }}'
          if [ -n "$before" ] \
            && [ "$before" != "0000000000000000000000000000000000000000" ] \
            && git cat-file -e "$before^{commit}" 2>/dev/null; then
            echo "ref=$before" >> "$GITHUB_OUTPUT"
          fi

      # A web-only change has no reason to compile and test the Go module, and
      # the reverse holds too. This stays inside the one job rather than
      # splitting into two, so the check name branch protection requires is
      # always reported.
      - id: changes
        if: github.event_name == 'pull_request' || steps.base.outputs.ref != ''
        continue-on-error: true
        uses: dorny/paths-filter@v4
        with:
          base: ${{ steps.base.outputs.ref }}
          filters: |
            api:
              - 'apps/api/**'
              - 'libs/types/**'
              - '.github/workflows/checks.yml'
              - '.github/workflows/deploy.yml'
              - 'docker-bake.hcl'
            web:
              - 'apps/web/**'
              - 'libs/**'
              - 'package.json'
              - 'bun.lock'
              - 'tsconfig.json'
              - 'biome.json'
              - '.github/workflows/checks.yml'
              - '.github/workflows/deploy.yml'
              - 'docker-bake.hcl'

      # Fail open. A skipped filter, an unresolvable base, or a filter that
      # errored all mean the whole suite runs, because a check that silently
      # narrows itself is worse than one that occasionally does too much.
      - id: scope
        shell: bash
        run: |
          set -euo pipefail
          if [ '${{ steps.changes.outcome }}' = 'success' ]; then
            echo 'api=${{ steps.changes.outputs.api }}' >> "$GITHUB_OUTPUT"
            echo 'web=${{ steps.changes.outputs.web }}' >> "$GITHUB_OUTPUT"
          else
            echo 'api=true' >> "$GITHUB_OUTPUT"
            echo 'web=true' >> "$GITHUB_OUTPUT"
          fi

      - if: steps.scope.outputs.api == 'true'
        uses: actions/setup-go@v5
        with:
          go-version-file: apps/api/go.mod
          # setup-go keys its cache on go.sum and restores on an exact match
          # only, so a dependency bump starts from nothing. The cache below
          # keeps a restore-keys fallback for that case.
          cache: false

      - name: Stamp the Go cache key
        if: steps.scope.outputs.api == 'true'
        run: echo "GO_CACHE_DATE=$(date -u +%Y-%m-%d)" >> "$GITHUB_ENV"

      - name: Restore the Go module and build caches
        if: steps.scope.outputs.api == 'true'
        id: go-cache
        uses: actions/cache/restore@v4
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: ${{ runner.os }}-go-${{ hashFiles('apps/api/go.sum') }}-${{ env.GO_CACHE_DATE }}
          restore-keys: |
            ${{ runner.os }}-go-${{ hashFiles('apps/api/go.sum') }}-
            ${{ runner.os }}-go-

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.13

      - run: bun install --frozen-lockfile

      - if: steps.scope.outputs.web == 'true'
        run: bun run type-check

      - if: steps.scope.outputs.web == 'true'
        run: bun test
        working-directory: libs/types

      - if: steps.scope.outputs.web == 'true'
        run: bun run test:ui

      - if: steps.scope.outputs.web == 'true'
        run: bun run test:web

      - if: steps.scope.outputs.api == 'true'
        run: go test ./...
        working-directory: apps/api

      - if: steps.scope.outputs.api == 'true'
        run: go vet ./...
        working-directory: apps/api

      - if: steps.scope.outputs.web == 'true'
        run: bun run build

      - if: steps.scope.outputs.api == 'true'
        run: bun run build:api

      # A cache written by a pull request run is scoped to that run's merge ref
      # and can only be restored by a re-run of the same pull request, so
      # saving one there spends 265 MB of the repository's 10 GB budget on an
      # entry nothing will ever read. Evictions are by least recent access, and
      # the Docker layer cache is touched only on a release, so that churn
      # would quietly evict the build cache between deployments. The date in
      # the key bounds writes to one per branch per day.
      - name: Save the Go module and build caches
        if: >-
          github.event_name != 'pull_request'
          && steps.scope.outputs.api == 'true'
          && steps.go-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: ${{ runner.os }}-go-${{ hashFiles('apps/api/go.sum') }}-${{ env.GO_CACHE_DATE }}

  terraform:
    runs-on: ubuntu-latest
    env:
      TF_PLUGIN_CACHE_DIR: ${{ github.workspace }}/.terraform-plugin-cache
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.16.0
          terraform_wrapper: false

      # The google and cloudflare providers are otherwise downloaded from the
      # registry on every init, here and in two other workflows.
      - name: Restore the Terraform provider cache
        id: tf-cache
        uses: actions/cache/restore@v4
        with:
          path: ${{ env.TF_PLUGIN_CACHE_DIR }}
          key: ${{ runner.os }}-terraform-${{ hashFiles('infra/prod/.terraform.lock.hcl') }}
          restore-keys: ${{ runner.os }}-terraform-

      - name: Create the provider cache directory
        run: mkdir -p "$TF_PLUGIN_CACHE_DIR"

      - name: Check Terraform formatting
        working-directory: infra/prod
        run: terraform fmt -check -recursive

      - name: Validate Terraform configuration
        working-directory: infra/prod
        run: |
          terraform init -backend=false -input=false -lockfile=readonly
          terraform validate -no-color

      # An entry written by a pull request run is scoped to that run's merge
      # ref and can only be read back by a re-run of the same pull request.
      # Restore from the base branch, but leave the writing to pushes.
      - name: Save the Terraform provider cache
        if: github.event_name != 'pull_request' && steps.tf-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ${{ env.TF_PLUGIN_CACHE_DIR }}
          key: ${{ runner.os }}-terraform-${{ hashFiles('infra/prod/.terraform.lock.hcl') }}
