name: Build and Deploy to the VPS

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: slidesage-production
  cancel-in-progress: false

env:
  IMAGE_VERSION: ${{ github.sha }}
  WEB_DOMAIN: ${{ vars.WEB_DOMAIN || 'slidesage.app' }}
  API_DOMAIN: ${{ vars.API_DOMAIN || 'api.slidesage.app' }}

jobs:
  checks:
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: read
      pull-requests: read
    uses: ./.github/workflows/checks.yml

  build:
    needs: checks
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: apps/api/go.mod
          cache: false

      - name: Stamp the Go cache key
        run: echo "GO_CACHE_DATE=$(date -u +%Y-%m-%d)" >> "$GITHUB_ENV"

      - name: Restore the Go module and build caches
        uses: actions/cache/restore@v4
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: ${{ runner.os }}-go-${{ hashFiles('apps/api/go.sum') }}-${{ env.GO_CACHE_DATE }}
          restore-keys: |
            ${{ runner.os }}-go-${{ hashFiles('apps/api/go.sum') }}-
            ${{ runner.os }}-go-

      - name: Build the release binaries
        working-directory: apps/api
        env:
          CGO_ENABLED: "0"
          GOOS: linux
          GOARCH: amd64
        run: |
          set -euo pipefail
          mkdir -p "$GITHUB_WORKSPACE/dist"
          for component in api worker migrate; do
            go build -mod=readonly -trimpath -buildvcs=false -ldflags="-s -w" \
              -o "$GITHUB_WORKSPACE/dist/$component" "./cmd/$component"
            test -x "$GITHUB_WORKSPACE/dist/$component"
          done

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.13

      - name: Bundle the card converter and the frontend
        run: |
          set -euo pipefail
          bun install --frozen-lockfile
          bun build apps/converter/src/main.ts --target bun --outfile dist/converter.js
          test -s dist/converter.js
          VITE_API_URL="https://$API_DOMAIN" bun run --cwd apps/web build
          cp -r apps/web/dist dist/web
          grep -rqF "https://$API_DOMAIN" dist/web/assets

      # GHCR paths must be lowercase; the repository owner is not.
      - name: Resolve the image registry path
        run: echo "REGISTRY=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/slidesage" >> "$GITHUB_ENV"

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-buildx-action@v3

      - name: Build and push the runtime images
        uses: docker/bake-action@v7
        with:
          source: .
          files: docker-bake.hcl
          push: true

  deploy:
    needs: build
    # Off until the server exists, so main stays green before then.
    if: github.ref == 'refs/heads/main' && vars.VPS_DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      VPS_HOST: ${{ secrets.VPS_HOST }}
      VPS_USER: ${{ vars.VPS_USER || 'slidesage' }}
    steps:
      - uses: actions/checkout@v4

      # The pinned host key is the only trust anchor for the server. Never
      # replace it with StrictHostKeyChecking=no.
      - name: Configure SSH
        env:
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          install -m 700 -d ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$VPS_KNOWN_HOSTS" > ~/.ssh/known_hosts

      # Without --delete, the server-only .env, certs/, secrets/, and backups/
      # survive the sync.
      - name: Sync the stack files
        run: rsync -a infra/ "$VPS_USER@$VPS_HOST:/opt/slidesage/"

      - name: Back up, migrate, and roll the release
        run: |
          # The tag is expanded here on purpose; it is a commit SHA.
          # shellcheck disable=SC2029
          ssh "$VPS_USER@$VPS_HOST" "/opt/slidesage/deploy.sh '$IMAGE_VERSION'"

      - name: Verify the public endpoints
        run: |
          set -euo pipefail
          for attempt in {1..10}; do
            if curl -fsS -o /dev/null "https://$API_DOMAIN/health"; then
              break
            fi
            test "$attempt" -lt 10
            sleep 3
          done
          curl -fsS "https://$WEB_DOMAIN/" | grep -q 'id="root"'
          curl -fsS -o /dev/null "https://$WEB_DOMAIN/sign-in"
