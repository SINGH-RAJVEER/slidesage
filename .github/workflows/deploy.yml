{
	"name": "Deploy Cloudflare Containers",
	"on": {
		"workflow_dispatch": {
			"inputs": {
				"database_prepared": {
					"description": "VPS backup, schema migrations, SSH tunnel, secrets and object migration are prepared per the cutover runbook",
					"type": "boolean",
					"required": true,
					"default": false
				}
			}
		}
	},
	"permissions": { "contents": "read" },
	"concurrency": { "group": "cloudflare-production", "cancel-in-progress": false },
	"jobs": {
		"deploy": {
			"if": "github.ref == 'refs/heads/main' && inputs.database_prepared",
			"runs-on": "ubuntu-latest",
			"timeout-minutes": 30,
			"environment": { "name": "cloudflare-production", "url": "https://api.slidesage.app/health" },
			"steps": [
				{ "uses": "actions/checkout@v4" },
				{ "uses": "actions/setup-go@v5", "with": { "go-version-file": "apps/api/go.mod", "cache-dependency-path": "apps/api/go.sum" } },
				{ "uses": "actions/setup-node@v4", "with": { "node-version": "24" } },
				{ "uses": "oven-sh/setup-bun@v2", "with": { "bun-version": "1.3.13" } },
				{ "run": "bun install --frozen-lockfile" },
				{
					"name": "Compile the Container runtime",
					"env": { "CGO_ENABLED": "0", "GOOS": "linux", "GOARCH": "amd64" },
					"run": "set -euo pipefail\nmkdir -p dist\nfor component in api worker converter container; do\n\tgo -C apps/api build -mod=readonly -trimpath -buildvcs=false -ldflags='-s -w' -o \"$GITHUB_WORKSPACE/dist/$component\" \"./cmd/$component\"\ndone\n"
				},
				{
					"name": "Deploy the Worker and Container images",
					"env": { "CLOUDFLARE_API_TOKEN": "${{ secrets.CLOUDFLARE_API_TOKEN }}", "CLOUDFLARE_ACCOUNT_ID": "${{ vars.CLOUDFLARE_ACCOUNT_ID }}" },
					"run": "bun run --cwd apps/edge deploy"
				},
				{
					"name": "Check API health",
					"run": "curl --fail --silent --show-error --retry 5 --retry-delay 5 --retry-all-errors --max-time 90 https://api.slidesage.app/health"
				}
			]
		}
	}
}
