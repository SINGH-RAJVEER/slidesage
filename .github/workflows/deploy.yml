name: Build and Deploy to Cloud Run

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: slidesage-production
  cancel-in-progress: false

env:
  PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
  REGISTRY_LOCATION: asia-south1
  REGISTRY_REPOSITORY: slidesage
  RUN_REGION: asia-south1
  IMAGE_VERSION: ${{ github.sha }}

jobs:
  # The same suite that guards a pull request, run again on the merge commit
  # itself. Nothing is built or published unless it passes.
  checks:
    # workflow_dispatch can select a branch; only main may publish or deploy.
    if: github.ref == 'refs/heads/main'
    uses: ./.github/workflows/checks.yml

  build:
    needs: checks
    # workflow_dispatch can select a branch; only main may publish or deploy.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WIF_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker "$REGISTRY_LOCATION-docker.pkg.dev" --quiet

      - id: buildx
        uses: docker/setup-buildx-action@v3

      # BuildKit keeps layer cache and cache-mount contents in two separate
      # places, and type=gha only carries the former. Without this the Go module
      # and build caches mounted in apps/api/Dockerfile start empty every run,
      # so every dependency is recompiled from scratch.
      - name: Stamp the Go cache key
        run: echo "GO_CACHE_DATE=$(date -u +%Y-%m-%d)" >> "$GITHUB_ENV"

      - name: Restore the Go caches mounted during the build
        id: go-mount-cache
        uses: actions/cache@v4
        with:
          path: |
            go-mod-cache
            go-build-cache
          # Keying on go.sum alone would freeze the build cache until a
          # dependency moved; keying on the commit would write a 265 MB entry
          # every run and churn the repository's 10 GB budget, evicting the
          # Docker layer cache above. A date refreshes it once a day.
          key: ${{ runner.os }}-docker-go-${{ hashFiles('apps/api/go.sum') }}-${{ env.GO_CACHE_DATE }}
          restore-keys: |
            ${{ runner.os }}-docker-go-${{ hashFiles('apps/api/go.sum') }}-
            ${{ runner.os }}-docker-go-

      - name: Inject the Go caches into the builder
        uses: reproducible-containers/buildkit-cache-dance@v3
        with:
          builder: ${{ steps.buildx.outputs.name }}
          cache-map: |
            {
              "go-mod-cache": "/go/pkg/mod",
              "go-build-cache": "/root/.cache/go-build"
            }

      # One bake builds all three images. They share a single `build` stage, so
      # BuildKit compiles it once rather than re-entering the builder per image.
      #
      # An unscoped type=gha gives every image the same cache entry to
      # overwrite, leaving only the last one, so the cache is named explicitly.
      # One scope is enough here: all three images are the shared build stage
      # plus a COPY of one binary onto scratch. Writing worker and migrate to
      # scopes of their own only spends budget on entries nothing reads back,
      # because their whole build cost lives in the stage the api scope holds.
      - name: Build and push the API, worker, and migrate images
        uses: docker/bake-action@v7
        with:
          source: .
          files: docker-bake.hcl
          push: true
          set: |
            *.cache-from=type=gha,scope=slidesage-api
            api.cache-to=type=gha,mode=max,scope=slidesage-api
        env:
          PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
          REGISTRY: ${{ env.REGISTRY_LOCATION }}-docker.pkg.dev
          REPOSITORY: ${{ env.REGISTRY_REPOSITORY }}
          IMAGE_VERSION: ${{ env.IMAGE_VERSION }}

  deploy:
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    env:
      TF_IN_AUTOMATION: "true"
      TF_INPUT: "false"
      TF_STATE_BUCKET: ${{ secrets.TF_STATE_BUCKET }}
      TF_VAR_gcp_project_id: ${{ secrets.GCP_PROJECT_ID }}
      TF_VAR_gcp_region: asia-south1
      TF_VAR_cloudflare_account_id: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      TF_VAR_cloudflare_api_token: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      # Telemetry export stays off until DATADOG_OTLP_ENDPOINT is set, and the
      # DATADOG_OTLP_HEADERS secret exists in Secret Manager.
      TF_VAR_otel_exporter_otlp_endpoint: ${{ vars.DATADOG_OTLP_ENDPOINT }}
      TF_VAR_otel_logs_exporter: ${{ vars.OTEL_LOGS_EXPORTER || 'otlp' }}
      TF_VAR_otel_service_version: ${{ github.sha }}
      TF_PLUGIN_CACHE_DIR: ${{ github.workspace }}/.terraform-plugin-cache
    steps:
      - uses: actions/checkout@v4

      - id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WIF_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - uses: google-github-actions/setup-gcloud@v2

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.16.0
          terraform_wrapper: false

      # The google and cloudflare providers are large and otherwise downloaded
      # from the registry on every init, in this workflow and two others.
      - name: Restore the Terraform provider cache
        uses: actions/cache@v4
        with:
          path: ${{ env.TF_PLUGIN_CACHE_DIR }}
          key: ${{ runner.os }}-terraform-${{ hashFiles('infra/prod/.terraform.lock.hcl') }}
          restore-keys: ${{ runner.os }}-terraform-

      - name: Create the provider cache directory
        run: mkdir -p "$TF_PLUGIN_CACHE_DIR"

      # Nothing between here and the migration depends on the backup, and it is
      # the longest single step in the release, so start it now and only block
      # on it immediately before the schema changes.
      - name: Start the pre-migration database backup
        shell: bash
        run: |
          set -euo pipefail
          operation=$(gcloud sql backups create --instance=slidesage-postgres \
            --project="$PROJECT_ID" --description="Before release $IMAGE_VERSION" \
            --async --format='value(name)')
          test -n "$operation"
          echo "BACKUP_OPERATION=$operation" >> "$GITHUB_ENV"

      - name: Configure Terraform inputs
        shell: bash
        run: |
          set -euo pipefail
          : "${TF_STATE_BUCKET:?Set TF_STATE_BUCKET after provisioning the state bucket}"
          : "${TF_VAR_gcp_project_id:?Set GCP_PROJECT_ID}"
          : "${TF_VAR_cloudflare_account_id:?Set CLOUDFLARE_ACCOUNT_ID}"
          : "${TF_VAR_cloudflare_api_token:?Set CLOUDFLARE_API_TOKEN}"
          for component in api worker migrate; do
            echo "TF_VAR_${component}_image=$REGISTRY_LOCATION-docker.pkg.dev/$PROJECT_ID/$REGISTRY_REPOSITORY/$component:$IMAGE_VERSION" >> "$GITHUB_ENV"
          done

      - name: Initialize Terraform
        working-directory: infra/prod
        run: |
          terraform init -input=false -lockfile=readonly \
            -backend-config="bucket=$TF_STATE_BUCKET" \
            -backend-config="prefix=prod"
          terraform validate -no-color

      # Check the whole configuration before the targeted migration update.
      # Missing secrets, DNS permissions, or invalid imports stop here.
      - name: Plan the release
        working-directory: infra/prod
        run: terraform plan -input=false -lock-timeout=5m -no-color

      - name: Update the migration job
        working-directory: infra/prod
        run: |
          terraform plan -input=false -lock-timeout=5m -no-color \
            -target=google_cloud_run_v2_job.migrate -out=migrate.tfplan
          terraform apply -input=false -lock-timeout=5m -no-color migrate.tfplan

      # Stop requests and polling before destructive schema changes. Keep the
      # previous images in this phase so new binaries never see the old schema.
      - name: Pause services for database migration
        working-directory: infra/prod
        shell: bash
        run: |
          set -euo pipefail
          args=(-var=maintenance_mode=true)
          for component in api worker; do
            service="$component"
            resource="$component"
            image=$(gcloud run services describe "$service" \
              --project="$PROJECT_ID" --region="$RUN_REGION" \
              --format='value(spec.template.spec.containers[0].image)')
            test -n "$image"
            args+=("-var=${component}_image=$image")
            args+=("-target=google_cloud_run_v2_service.$resource")
          done
          terraform plan -input=false -lock-timeout=5m -no-color \
            "${args[@]}" -out=maintenance.tfplan
          terraform apply -input=false -lock-timeout=5m -no-color maintenance.tfplan

      - name: Remove the legacy preview worker
        shell: bash
        run: |
          if gcloud run services describe preview-worker \
            --project="$PROJECT_ID" --region="$RUN_REGION" >/dev/null 2>&1; then
            gcloud run services delete preview-worker \
              --project="$PROJECT_ID" --region="$RUN_REGION" --quiet
          fi

      # No schema change may start until the backup that covers it exists.
      #
      # `gcloud sql operations wait` documents a timeout and nothing about what
      # it returns for an operation that finished with an error, so its exit
      # status is not trusted here. Read the operation back and assert on the
      # status and error fields, which are unambiguous.
      - name: Wait for the pre-migration database backup
        shell: bash
        run: |
          set -euo pipefail
          : "${BACKUP_OPERATION:?The backup was never started}"
          gcloud sql operations wait "$BACKUP_OPERATION" \
            --project="$PROJECT_ID" --timeout=1800 || true
          operation=$(gcloud sql operations describe "$BACKUP_OPERATION" \
            --project="$PROJECT_ID" --format=json)
          status=$(jq -r '.status // empty' <<<"$operation")
          error=$(jq -r '.error // empty' <<<"$operation")
          if [ "$status" != "DONE" ] || [ -n "$error" ]; then
            echo "The pre-migration backup did not complete cleanly:" >&2
            jq . <<<"$operation" >&2
            exit 1
          fi

      - name: Run migrations
        run: |
          gcloud run jobs execute slidesage-migrate \
            --project="$PROJECT_ID" --region="$RUN_REGION" --wait

      # Re-plan after the targeted apply, which changed Terraform state.
      - name: Apply the release
        working-directory: infra/prod
        run: |
          terraform plan -input=false -lock-timeout=5m -no-color -out=release.tfplan
          terraform apply -input=false -lock-timeout=5m -no-color release.tfplan

      - name: Verify Cloud Run exposure
        run: |
          API_INGRESS=$(gcloud run services describe api \
            --project="$PROJECT_ID" \
            --region="$RUN_REGION" \
            --format="value(metadata.annotations.'run.googleapis.com/ingress')")
          WORKER_INGRESS=$(gcloud run services describe worker \
            --project="$PROJECT_ID" \
            --region="$RUN_REGION" \
            --format="value(metadata.annotations.'run.googleapis.com/ingress')")
          WORKER_PUBLIC_BINDING=$(gcloud run services get-iam-policy worker \
            --project="$PROJECT_ID" \
            --region="$RUN_REGION" \
            --flatten='bindings[].members' \
            --filter='bindings.role=roles/run.invoker AND bindings.members=allUsers' \
            --format='value(bindings.members)')

          test "$API_INGRESS" = internal-and-cloud-load-balancing
          test "$WORKER_INGRESS" = internal
          test -z "$WORKER_PUBLIC_BINDING"
