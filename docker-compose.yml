services:
  database:
    build:
      context: ./apps/database
    image: slide-sage:postgres
    container_name: slide-sage-postgres
    environment:
      POSTGRES_USER: slidesage
      POSTGRES_PASSWORD: slidesage
      POSTGRES_DB: slidesage
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U slidesage"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: apps/backend/Dockerfile
    image: slidesage-backend:latest
    ports:
      - "8000:8000"
    restart: unless-stopped
    env_file:
      - .env

  frontend:
    build:
      context: .
      dockerfile: apps/frontend/Dockerfile
    image: slidesage-frontend:latest
    ports:
      - "5173:5173"
    env_file:
      - .env
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  postgres_data:
