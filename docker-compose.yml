services:
  database:
    build:
      context: ./database
    image: slide-sage:postgres
    container_name: slide-sage-postgres
    environment:
      POSTGRES_USER: slidesage
      POSTGRES_PASSWORD: slidesage
      POSTGRES_DB: slidesage
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U slidesage"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: slidesage-backend:latest
    ports:
      - "8000:8000"
    restart: unless-stopped
    env_file:
      - backend/.env
    environment:
      - PORT=${PORT:-8000}
      - DATABASE_URL=postgresql://slidesage:slidesage@postgres:5432/slidesage
      - GROQ_API_KEY=${GROQ_API_KEY}
      - LITELLM_MODEL=${LITELLM_MODEL}
      - JWT_SECRET_KEY=${JWT_SECRET_KEY}
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID}
      - GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET}
      - CORS_ORIGINS=${CORS_ORIGINS}
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    image: slidesage-frontend:latest
    ports:
      - "5173:5173"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  postgres_data:
