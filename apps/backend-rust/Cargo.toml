[package]
name = "slidesage-backend"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
default-run = "api"

[dependencies]
axum.workspace = true
chrono = { version = "0.4", default-features = false, features = ["clock", "serde"] }
hex = "0.4"
http-body-util.workspace = true
jsonwebtoken = { version = "10", default-features = false, features = ["rust_crypto"] }
percent-encoding = "2"
rand = "0.9"
redis = { version = "1.7", default-features = false, features = ["tokio-rustls-comp", "tls-rustls-webpki-roots"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
scrypt = { version = "0.11", default-features = false }
serde.workspace = true
serde_json.workspace = true
sha2 = "0.10"
sqlx = { version = "0.9", default-features = false, features = ["postgres", "runtime-tokio", "tls-rustls-ring-webpki", "chrono", "macros"] }
subtle = "2.6"
thiserror = "2"
tokio = { workspace = true, features = ["fs", "io-util", "sync", "time"] }
tokio-util = { version = "0.7", features = ["io"] }
unicode-normalization = "0.1"
uuid = { version = "1", features = ["v4"] }

[features]
postgres-tests = []

[[test]]
name = "feedback_postgres"
path = "tests/feedback_postgres.rs"
required-features = ["postgres-tests"]

[dev-dependencies]
tower.workspace = true
