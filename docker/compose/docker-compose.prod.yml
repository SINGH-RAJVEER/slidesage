# Production Docker Compose

services:
  database:
    build:
      context: ../..
      dockerfile: docker/dockerfiles/database.Dockerfile
    image: slide-sage/database:latest
    container_name: slide-sage-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-slidesage}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-slidesage}
      POSTGRES_DB: ${POSTGRES_DB:-slidesage}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: always
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-slidesage}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - slide-sage-network
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 256M

  backend:
    build:
      context: ../..
      dockerfile: docker/dockerfiles/backend.Dockerfile
      args:
        NODE_ENV: production
    image: slide-sage/backend:latest
    container_name: slide-sage-backend
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    restart: always
    env_file:
      - ../../.env
    environment:
      NODE_ENV: production
      LOG_LEVEL: info
      DATABASE_URL: postgresql://${POSTGRES_USER:-slidesage}:${POSTGRES_PASSWORD:-slidesage}@database:5432/${POSTGRES_DB:-slidesage}
      LITELLM_SEARCH_MODEL: ${LITELLM_SEARCH_MODEL:-llama-3.1-8b-instant}
    depends_on:
      database:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "--no-verbose",
          "--tries=1",
          "--spider",
          "http://localhost:8000/health",
        ]
      interval: 30s
      timeout: 10s
      start_period: 5s
      retries: 3
    networks:
      - slide-sage-network
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 256M

  frontend:
    build:
      context: ../..
      dockerfile: docker/dockerfiles/frontend.Dockerfile
      args:
        NODE_ENV: production
        VITE_API_URL: ${VITE_API_URL:-}
    image: slide-sage/frontend:latest
    container_name: slide-sage-frontend
    ports:
      - "${FRONTEND_PORT:-5173}:5173"
    env_file:
      - ../../.env
    environment:
      NODE_ENV: production
      VITE_API_URL: ${VITE_API_URL:-}
    depends_on:
      backend:
        condition: service_healthy
    restart: always
    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "--no-verbose",
          "--tries=1",
          "--spider",
          "http://localhost:5173",
        ]
      interval: 30s
      timeout: 10s
      start_period: 5s
      retries: 3
    networks:
      - slide-sage-network
    deploy:
      resources:
        limits:
          memory: 256M
        reservations:
          memory: 128M

  nginx:
    image: nginx:alpine
    container_name: slide-sage-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ../../docker/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ../../docker/nginx/ssl:/etc/nginx/ssl:ro
    depends_on:
      - frontend
      - backend
    restart: always
    networks:
      - slide-sage-network
    deploy:
      resources:
        limits:
          memory: 128M
        reservations:
          memory: 64M

networks:
  slide-sage-network:
    driver: bridge

volumes:
  postgres_data:
