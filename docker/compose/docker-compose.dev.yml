# Development Docker Compose

services:
  litellm:
    build:
      context: ../..
      dockerfile: docker/dockerfiles/litellm.Dockerfile
    image: slide-sage/litellm:dev
    container_name: slide-sage-litellm-dev
    ports:
      - "4000:4000"
    environment:
      GROQ_API_KEY: ${GROQ_API_KEY}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
    volumes:
      - ../../litellm_config.yaml:/app/litellm_config.yaml:ro
    restart: "no"
    networks:
      - slide-sage-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:4000/health"]
      interval: 10s
      timeout: 5s
      retries: 5

  database:
    build:
      context: ../..
      dockerfile: docker/dockerfiles/database.Dockerfile
    image: slide-sage/database:dev
    container_name: slide-sage-postgres-dev
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-slidesage}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-slidesage}
      POSTGRES_DB: ${POSTGRES_DB:-slidesage}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./initdb/init-dev-db.sql:/docker-entrypoint-initdb.d/init-dev-db.sql:ro
    restart: "no"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-slidesage}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - slide-sage-network

  apis:
    build:
      context: ../..
      dockerfile: docker/dockerfiles/backend.Dockerfile
      args:
        NODE_ENV: development
    image: slide-sage/apis:dev
    container_name: slide-sage-apis-dev
    ports:
      - "${APIS_PORT:-8000}:8000"
    restart: "no"
    env_file:
      - ../../.env
    environment:
      NODE_ENV: development
      LOG_LEVEL: debug
      DATABASE_URL: postgresql://${POSTGRES_USER:-slidesage}:${POSTGRES_PASSWORD:-slidesage}@database:5432/${POSTGRES_DB:-slidesage}
      LITELLM_PROXY_BASE: http://litellm:4000
      LITELLM_SEARCH_MODEL: ${LITELLM_SEARCH_MODEL:-llama-3.1-8b-instant}
    volumes:
      - ../../package.json:/app/package.json:ro
      - ../../bun.lock:/app/bun.lock:ro
      - ../../tsconfig.json:/app/tsconfig.json:ro
      - ../../apps/APIs:/app/apps/APIs
      - ../../packages/DB:/app/packages/DB
      - root_node_modules:/app/node_modules
      - apis_node_modules:/app/apps/APIs/node_modules
      - bun_cache:/root/.bun
    command: sh -c "cd /app && bun install --no-save --ignore-scripts && cd /app/apps/APIs && bun run db:push && bun run dev"
    depends_on:
      database:
        condition: service_healthy
      litellm:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "--no-verbose",
          "--tries=1",
          "--spider",
          "http://localhost:8000/health",
        ]
      interval: 30s
      timeout: 10s
      start_period: 180s
      retries: 3
    networks:
      - slide-sage-network

  web:
    build:
      context: ../..
      dockerfile: docker/dockerfiles/frontend.Dockerfile
      args:
        NODE_ENV: development
        VITE_API_URL: ${VITE_API_URL:-http://localhost:8000}
    image: slide-sage/web:dev
    container_name: slide-sage-web-dev
    ports:
      - "${WEB_PORT:-5173}:5173"
    env_file:
      - ../../.env
    environment:
      NODE_ENV: development
      VITE_API_URL: ${VITE_API_URL:-http://localhost:8000}
    volumes:
      - ../../package.json:/app/package.json:ro
      - ../../bun.lock:/app/bun.lock:ro
      - ../../tsconfig.json:/app/tsconfig.json:ro
      - ../../apps/Web:/app/apps/Web
      - ../../packages/DB:/app/packages/DB
      - root_node_modules:/app/node_modules
      - web_node_modules:/app/apps/Web/node_modules
      - bun_cache:/root/.bun
    command: sh -c "cd /app && bun install --no-save --ignore-scripts && cd /app/apps/Web && bun run dev --host 0.0.0.0"
    depends_on:
      apis:
        condition: service_healthy
    restart: "no"
    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "--no-verbose",
          "--tries=1",
          "--spider",
          "http://localhost:5173",
        ]
      interval: 30s
      timeout: 10s
      start_period: 180s
      retries: 3
    networks:
      - slide-sage-network

networks:
  slide-sage-network:
    driver: bridge

volumes:
  bun_cache:
  postgres_data:
  root_node_modules:
  apis_node_modules:
  web_node_modules:
